version: "2"

run:
  timeout: 5m

formatters:
  enable:
    - gofmt

linters:
  default: none
  enable:
    - govet
    - gosec
    - unused
    - staticcheck
  settings:
    gosec:
      # Exclusions are deliberate; each carries a design justification.
      # Revisit if the underlying design changes.
      excludes:
        # Errors that matter on the data path are returned and logged by the
        # caller (tunnel/facade/monitor all propagate). Remaining sites are
        # deferred Close() and best-effort stats/logging writes where an
        # error has no meaningful handler.
        - G104
        # Opening cert/key/log/config files whose paths come from config is
        # the program's purpose. Path hygiene (no '..', no '//', extension
        # allowlist) is enforced at config-validation time.
        - G304
        # TUN management shells out to `sudo ip ...` with config-supplied,
        # regex-validated interface names (adapter.ValidateInterfaceName).
        - G204
        # Metric counter/gauge conversions between signed/unsigned widths;
        # values are bounded by their producers.
        - G115
        # Slice indexing in checksum/packet loops is length-bounded (gosec's
        # taint analysis can't prove the `i+1 < len` guard), so G602 is a
        # false positive.
        - G602
        # copyFile writes to filepath.Join(targetDir, filepath.Base(src)); the
        # Base() call strips traversal and targetDir is config-validated, so
        # G703's taint path is a false positive.
        - G703
        # The facade proxy dials the configured LOCAL tunnel listener (not
        # user input), so G704's SSRF taint is a false positive.
        - G704
  exclusions:
    rules:
      # Tests may use seeded math/rand for determinism; only production
      # code paths touching secrets require crypto/rand.
      - path: _test\.go
        text: "G404"
        linters:
          - gosec
      # Test fixtures embed fake certs/tokens (never real secrets); the G101
      # hardcoded-credential flag is expected in fixtures.
      - path: _test\.go
        text: "G101"
        linters:
          - gosec

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
