metadata:
  schema_version: "2.0.0"
  environment: qa
type: client
config:
  mode: client
  logging:
    level: info
    format: json
  network:
    name: tun0
    interface: tun0
    mtu: 1400
    address: "10.77.0.2/24"
  tunnel:
    server_address: "192.168.101.172"
    server_port: 8443
  auth:
    cert_file: /etc/sssonector/certs/client.crt
    key_file: /etc/sssonector/certs/client.key
    ca_file: /etc/sssonector/certs/ca.crt
  security:
    allow_plaintext: false
    tls:
      min_version: "1.3"
      max_version: "1.3"
  metrics:
    enabled: true
    interval: 5s
  monitor:
    enabled: true
    type: prometheus
    interval: 5s
    prometheus:
      enabled: true
      port: 9090
      path: /metrics
