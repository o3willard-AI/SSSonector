global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Direct scrape of the daemon's Prometheus endpoint.
  # Requires the daemon to run with monitor.type: prometheus and
  # monitor.prometheus.enabled: true on port 9090 (see configs/server.yaml).
  - job_name: 'sssonector'
    metrics_path: /metrics
    static_configs:
      - targets:
          - 'host.docker.internal:9090'  # Daemon on the docker host

  # SNMP exporter path for deployments that prefer polling over UDP.
  # Module definition lives in ./snmp.yml (mounted into snmp-exporter).
  - job_name: 'SSSonector-snmp'
    metrics_path: /snmp
    params:
      module: [sssonector]
    static_configs:
      - targets:
          - 'host.docker.internal:10162'  # Daemon SNMP agent
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: 'snmp-exporter:9116'
