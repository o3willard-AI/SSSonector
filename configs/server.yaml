type: server
config:
  mode: server
  logging:
    level: debug
    file: /var/log/sssonector/server.log
    format: json
  network:
    name: tun0
    interface: tun0
    mtu: 1500
    address: 10.0.0.1/24
  tunnel:
    listen_address: 0.0.0.0
    listen_port: 8443
    protocol: tcp
    compression: false
  security:
    tls:
      min_version: "1.2"
      max_version: "1.3"
    auth_method: certificate
    cert_rotation:
      enabled: false
  monitor:
    enabled: true
    type: prometheus
    interval: 10s
    prometheus:
      enabled: true
      port: 9090
      path: /metrics
  metrics:
    enabled: true
    interval: 5s
    buffer_size: 1000
  # HTTPS Facade for firewall traversal
  # When enabled, the server runs a legitimate HTTPS web server on port 443.
  # Tunnel connections arrive as WebSocket upgrades and are proxied to the
  # configured tunnel port, making traffic indistinguishable from normal HTTPS.
  facade:
    enabled: false
    listen_address: 0.0.0.0
    listen_port: 443
    # hostname: server.example.com
    web_root: ""             # HTML content for GET / (empty = default page)
    token_secret: ""         # Shared secret for HMAC tokens (empty = derived from CA cert)
    token_ttl: 30s
    tls:                     # If empty, inherits from auth section
      cert_file: ""
      key_file: ""
      ca_file: ""
    tunnel_ports:            # Tunnel ports this facade routes to
      - 8443
throttle:
  enabled: false
  rate: 1048576
  burst: 104858
metadata:
  version: 1.0.0
  environment: qa
  region: local
