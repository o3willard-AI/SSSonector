mode: "client"

network:
  interface: "tun0"
  address: "10.0.0.2/24"
  mtu: 1500

tunnel:
  cert_file: "certs/client.crt"
  key_file: "certs/client.key"
  ca_file: "certs/ca.crt"
  server_address: "192.168.50.210"
  server_port: 8443
  upload_kbps: 10240
  download_kbps: 10240

monitor:
  log_file: "client.log"
  snmp_enabled: true
  snmp_port: 10162
  snmp_community: "public"
  snmp_address: "0.0.0.0"

# HTTPS Facade fallback for firewall traversal
# When enabled, the client first tries a direct connection to server_port.
# If that fails (e.g., port blocked by firewall), it falls back to connecting
# through the HTTPS facade on port 443 using a WebSocket upgrade.
facade:
  enabled: false
  server_port: 443           # Facade server port to connect to
  # server_address: ""       # Defaults to tunnel.server_address
  direct_timeout: 3s         # How long to wait for direct connection
  token_secret: ""           # REQUIRED for facade auth: must match server exactly
  tls:                       # If empty, inherits from tunnel cert config
    cert_file: ""
    key_file: ""
    ca_file: ""
