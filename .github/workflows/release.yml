name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g. v1.0.0)'
        required: true
        type: string

env:
  GO_VERSION: '1.26.8'

jobs:
  build:
    name: Build ${{ matrix.os }}/${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - os: linux
            arch: amd64
            runner: ubuntu-latest
          - os: linux
            arch: arm64
            runner: ubuntu-latest
          - os: linux
            arch: arm
            runner: ubuntu-latest
          - os: darwin
            arch: amd64
            runner: macos-latest
          - os: darwin
            arch: arm64
            runner: macos-latest
          - os: windows
            arch: amd64
            runner: windows-latest
          - os: windows
            arch: arm64
            runner: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Go
        uses: actions/setup-go@3041bf56c941b39c61721a86cd11f3bb1338122a # v5.2.0
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Get version
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "VERSION=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Build binary
        shell: bash
        env:
          CGO_ENABLED: 0
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
        run: |
          BINARY_NAME="sssonector-${{ matrix.os }}-${{ matrix.arch }}"
          if [ "${{ matrix.os }}" = "windows" ]; then
            BINARY_NAME="${BINARY_NAME}.exe"
          fi

          go build -trimpath -ldflags="-s -w -X main.Version=${{ steps.version.outputs.VERSION }}" \
            -o "dist/${BINARY_NAME}" \
            ./cmd/daemon

          echo "BINARY_NAME=${BINARY_NAME}" >> $GITHUB_ENV

      - name: Upload artifact
        uses: actions/upload-artifact@6f51ac03b9356f520e9adb1b1b7802705f340c2b # v4.5.0
        with:
          name: sssonector-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/${{ env.BINARY_NAME }}
          retention-days: 1

  verify:
    name: Smoke-Test Release Candidate
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Download linux/amd64 artifact
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: sssonector-linux-amd64
          path: dist

      - name: Verify binary behavior BEFORE publishing
        run: |
          chmod +x dist/sssonector-linux-amd64
          dist/sssonector-linux-amd64 -version 2>&1 | grep -q . || { echo "-version produced no output"; exit 1; }
          dist/sssonector-linux-amd64 -help >/dev/null 2>&1 || { echo "-help failed"; exit 1; }

  release:
    name: Create Release
    needs: [build, verify]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Go
        uses: actions/setup-go@3041bf56c941b39c61721a86cd11f3bb1338122a # v5.2.0
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Download all artifacts
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          path: dist

      - name: Prepare release assets, SBOM and checksums
        run: |
          cd dist
          mkdir -p release
          find . -mindepth 2 -maxdepth 2 -type f -exec mv {} release/ \;

          go install github.com/CycloneDX/cyclonedx-gomod/cmd/cyclonedx-gomod@v1.8.0
          # cyclonedx-gomod mod requires a go.mod in the CWD; dist/ is not a
          # module, so run from the repo root and write the SBOM into release/.
          cd "$GITHUB_WORKSPACE"
          cyclonedx-gomod mod -licenses -json -output dist/release/sbom.cyclonedx.json

          # Publish the installer scripts alongside the binaries so every
          # release is self-contained; SHA256SUMS covers them too.
          cp install.sh scripts/install.ps1 dist/release/

          cd dist/release
          # sssonector-* covers every binary asset including the windows .exe
          # files (the .exe extension is part of the asset name).
          sha256sum sssonector-* install.sh install.ps1 sbom.cyclonedx.json > SHA256SUMS
          ls -la

      - name: Get version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "VERSION=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Generate release notes
        id: notes
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          cat > release_notes.md << EOF
          ## SSSonector ${VERSION}

          ### Download

          | Platform | Architecture | Binary |
          |----------|-------------|--------|
          | Linux | amd64 | sssonector-linux-amd64 |
          | Linux | arm64 | sssonector-linux-arm64 |
          | Linux | arm (armv7l) | sssonector-linux-arm |
          | macOS | amd64 | sssonector-darwin-amd64 |
          | macOS | arm64 | sssonector-darwin-arm64 |
          | Windows | amd64 | sssonector-windows-amd64.exe |
          | Windows | arm64 | sssonector-windows-arm64.exe |

          All binaries are published with a SHA256SUMS manifest. Verify before use:

              sha256sum -c --ignore-missing SHA256SUMS

          ### Install

          Installer scripts are attached to this release (`install.sh`, `install.ps1`).
          The canonical install entrypoints are the raw URLs (always the main-branch version):

          Linux:

          \`\`\`bash
          curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/main/install.sh | sudo bash
          \`\`\`

          Windows (run from an elevated PowerShell):

          \`\`\`powershell
          irm https://raw.githubusercontent.com/${{ github.repository }}/main/scripts/install.ps1 | iex
          \`\`\`

          The installers verify binary checksums against the published manifest.

          ### Verify

          \`\`\`bash
          sssonector -version
          \`\`\`
          EOF

          echo "RELEASE_NOTES<<EOF" >> $GITHUB_OUTPUT
          cat release_notes.md >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@6da8fa9354ddfdc4aeace5fc48d7f679b5214090 # v2.4.1
        with:
          tag_name: ${{ steps.version.outputs.VERSION }}
          name: SSSonector ${{ steps.version.outputs.VERSION }}
          body: ${{ steps.notes.outputs.RELEASE_NOTES }}
          draft: false
          prerelease: ${{ contains(steps.version.outputs.VERSION, '-') }}
          files: |
            dist/release/sssonector-*
            dist/release/SHA256SUMS
            dist/release/sbom.cyclonedx.json
            dist/release/install.sh
            dist/release/install.ps1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
